name: Newsletter Charbonneur

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Adresse pour un envoi de TEST (laisser vide pour envoyer à toute la liste)"
        required: false
        default: ""
      days:
        description: "Fenêtre d'articles en jours"
        required: false
        default: "7"
      mode:
        description: "campaign (défaut) ou direct (transactionnel individuel, contournement)"
        required: false
        default: "campaign"
      min_age_h:
        description: "Sas de maturation en heures pour l'envoi réel (0 = dérogation explicite)"
        required: false
        default: "24"
  schedule:
    # Chaque vendredi 17h00 UTC (19h00 heure de Lens en été)
    - cron: "0 17 * * 5"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Envoi newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          MIN_AGE_H: ${{ github.event.inputs.min_age_h || '24' }}
          MODE: ${{ github.event.inputs.mode || 'direct' }}
        run: node scripts/newsletter.js
